<div class="container mx-auto p-4" *ngIf="actor">
  <div class="flex flex-col md:flex-row">
    <div class="md:w-1/3">
      <img [src]="actor.mainImage" alt="{{actor.name}}" class="w-full h-auto">
    </div>
    <div class="md:w-2/3 md:pl-4">
      <h2 class="text-3xl font-bold mb-2">{{actor.name}}</h2>
      <p class="mb-2">Fecha de nacimiento: {{actor.birthDate | date}}</p>
      <p class="mb-4">{{actor.biography}}</p>
      <h3 class="text-xl font-semibold mb-2">Películas:</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <div *ngFor="let movie of actor.movies" class="border rounded p-2">
          <img [src]="movie.mainImage" alt="{{movie.title}}" class="w-full h-32 object-cover mb-2">
          <h4 class="font-semibold">{{movie.title}}</h4>
          <p>{{movie.releaseYear}}</p>
          <a [routerLink]="['/movies', movie.id]" class="text-blue-500 hover:underline">Ver detalles</a>
        </div>
      </div>
      <div *ngIf="isAdmin" class="mt-4">
        <button (click)="editActor()" class="bg-blue-500 text-white p-2 rounded mr-2">Editar</button>
        <button (click)="deleteActor()" class="bg-red-500 text-white p-2 rounded">Eliminar</button>
      </div>
    </div>
  </div>
</div>
