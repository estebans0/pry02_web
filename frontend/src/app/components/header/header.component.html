<header class="bg-black text-white py-4 px-6 flex justify-between items-center shadow-lg">
  <div class="text-3xl font-bold">
    <a routerLink="/" class="text-yellow-400 hover:text-yellow-300 transition">IMDb</a>
  </div>
  <nav class="space-x-6 flex items-center">
    <a routerLink="/movies" class="hover:text-yellow-400">Películas</a>
    <a routerLink="/actors" class="hover:text-yellow-400">Actores</a>

    <!-- Si el usuario está autenticado -->
    <ng-container *ngIf="isLoggedIn; else notLoggedIn">
      <span class="text-gray-300">Hola, {{ username }}</span>
      <button (click)="logout()" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">Cerrar sesión</button>
    </ng-container>

    <!-- Si el usuario NO está autenticado -->
    <ng-template #notLoggedIn>
      <a routerLink="/login" class="hover:text-yellow-400">Iniciar Sesión</a>
      <a routerLink="/register" class="bg-yellow-400 text-black px-4 py-2 rounded hover:bg-yellow-500">
        Registrarse
      </a>
    </ng-template>
  </nav>
</header>
