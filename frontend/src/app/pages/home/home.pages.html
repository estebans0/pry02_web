<app-movie-list></app-movie-list>
<div class="bg-black text-white min-h-screen p-6 flex justify-center">
  
  <!-- Contenedor principal -->
  <div class="max-w-7xl w-full grid grid-cols-3 gap-6">
    
    <!-- Sección del carrusel (ocupa 2 columnas) -->
    <section class="relative col-span-2">
      <div class="relative">
        <!-- Imagen de fondo del carrusel -->
        <img [src]="featuredMovie.mainImage" alt="Destacado" class="w-full h-[500px] object-cover rounded-lg shadow-lg">
        
        <!-- Contenido del carrusel -->
        <div class="absolute bottom-8 left-8 bg-black bg-opacity-70 p-6 rounded-lg">
          <h2 class="text-4xl font-bold text-yellow-400">{{ featuredMovie.title }}</h2>
          <p class="text-gray-300">{{ featuredMovie.description }}</p>
          <button class="mt-4 bg-yellow-500 text-black px-6 py-3 rounded-lg font-bold hover:bg-yellow-600">
            ▶ Reproducir
          </button>
        </div>

        <!-- Botón anterior -->
        <button (click)="prevMovie()" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-gray-900 bg-opacity-50 text-white p-4 rounded-full hover:bg-opacity-80">
          ❮
        </button>

        <!-- Botón siguiente -->
        <button (click)="nextMovie()" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-gray-900 bg-opacity-50 text-white p-4 rounded-full hover:bg-opacity-80">
          ❯
        </button>
      </div>
    </section>

    <!-- Sección "Próximamente" (1 columna a la derecha) -->
    <section class="col-span-1">
      <h2 class="text-2xl font-bold mb-4 text-yellow-400">Próximamente</h2>
      <div class="space-y-4">
        <div *ngFor="let movie of upcomingMovies" class="flex items-center bg-gray-800 rounded-lg overflow-hidden shadow-md p-2">
          <img [src]="movie.mainImage" alt="{{ movie.title }}" class="w-20 h-28 object-cover rounded-lg">
          <div class="p-4">
            <h3 class="text-white font-semibold">{{ movie.title }}</h3>
            <p class="text-gray-400 text-sm">{{ movie.duration }}</p>
          </div>
        </div>
      </div>
      <a href="#" class="text-yellow-400 hover:underline mt-4 inline-block">Explorar tráileres ›</a>
    </section>

    <!-- Sección "Destacado Hoy" -->
    <section class="col-span-3 mt-12">
      <h2 class="text-2xl font-bold mb-4 text-yellow-400">Destacado hoy</h2>
      <div class="flex overflow-x-auto space-x-4">
        <div *ngFor="let movie of featuredMovies" class="flex-shrink-0 w-36">
          <img [src]="movie.mainImage" alt="{{ movie.title }}" class="w-full h-48 object-cover rounded-lg shadow-md">
        </div>
      </div>
    </section>

  </div>

</div>
