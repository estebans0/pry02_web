<app-movie-list></app-movie-list>

<div class="home-wrapper min-h-screen flex justify-center px-4 py-10 transition-all duration-300">

  <div class="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-3 gap-10">

    <!-- 🎞️ Carrusel principal -->
    <section class="lg:col-span-2 relative rounded-2xl overflow-hidden shadow-lg">
      <div class="relative">

        <a [routerLink]="['/movies', featuredMovie.id]">
          <img [src]="featuredMovie.mainImage" alt="Destacado"
               class="w-full h-[520px] object-cover rounded-2xl">
        </a>

        <!-- Overlay del contenido -->
        <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-[var(--bg-primary)]/95 via-[var(--bg-secondary)]/90 to-transparent p-8 rounded-b-2xl">
          <h2 class="text-4xl font-bold text-[var(--accent)] mb-2">{{ featuredMovie.title }}</h2>
          <p class="text-[var(--text-secondary)] max-w-2xl mb-4">{{ featuredMovie.description }}</p>
          <a [routerLink]="['/movies', featuredMovie.id]"
             class="inline-block bg-[var(--accent)] text-[var(--bg-primary)] px-6 py-3 rounded-lg font-semibold hover:opacity-85 transition">
            ▶ Ver Detalles
          </a>
        </div>

        <!-- Botones de navegación -->
        <button (click)="prevMovie()" 
                class="nav-btn left-6">
          ❮
        </button>
        <button (click)="nextMovie()" 
                class="nav-btn right-6">
          ❯
        </button>
      </div>
    </section>

    <!-- 🎬 Próximamente -->
    <section class="sidebar bg-[var(--bg-secondary)] p-6 rounded-2xl shadow-lg border border-[var(--border-color)]">
      <h2 class="text-2xl font-bold mb-5 text-[var(--accent)]">Próximamente</h2>
      <div class="space-y-4">
        <div *ngFor="let movie of upcomingMovies" 
             class="flex items-center bg-[var(--bg-primary)] border border-[var(--border-color)] rounded-xl overflow-hidden shadow-sm hover:scale-[1.02] transition-transform duration-200">
          <a [routerLink]="['/movies', movie.id]">
            <img [src]="movie.mainImage" alt="{{ movie.title }}" class="w-24 h-24 object-cover">
          </a>
          <div class="p-3">
            <h3 class="font-semibold text-[var(--text-primary)] leading-tight">{{ movie.title }}</h3>
            <p class="text-[var(--text-secondary)] text-sm">{{ movie.duration }}</p>
          </div>
        </div>
      </div>
      <a href="#" class="text-[var(--accent)] hover:underline mt-6 inline-block font-medium">Explorar tráileres ›</a>
    </section>

    <!-- ⭐ Destacado hoy -->
    <section class="lg:col-span-3 mt-12">
      <h2 class="text-2xl font-bold mb-6 text-[var(--accent)]">Destacado hoy</h2>
      <div class="flex overflow-x-auto space-x-6 pb-3">
        <div *ngFor="let movie of featuredMovies" 
             class="flex-shrink-0 w-40 rounded-xl overflow-hidden shadow-md border border-[var(--border-color)] bg-[var(--bg-secondary)] hover:shadow-lg transition">
          <a [routerLink]="['/movies', movie.id]">
            <img [src]="movie.mainImage" alt="{{ movie.title }}"
                 class="w-full h-56 object-cover rounded-t-xl">
            <div class="p-3">
              <h4 class="font-semibold text-[var(--text-primary)] text-sm">{{ movie.title }}</h4>
            </div>
          </a>
        </div>
      </div>
    </section>

  </div>
</div>
