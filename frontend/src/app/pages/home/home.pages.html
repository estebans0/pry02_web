<div class="bg-black text-white min-h-screen p-6">
  
  <!-- Carrusel de películas -->
  <section class="relative max-w-6xl mx-auto">
    <div class="relative">
      <!-- Imagen de fondo del carrusel con enlace -->
      <a [routerLink]="['/movies', featuredMovie.id]">
        <img [src]="featuredMovie.mainImage" alt="Destacado" class="w-full h-[500px] object-cover rounded-lg">
      </a>

      <!-- Contenido del carrusel -->
      <div class="absolute bottom-8 left-8">
        <h2 class="text-4xl font-bold">{{ featuredMovie.title }}</h2>
        <p class="text-gray-300">{{ featuredMovie.description }}</p>
        <a [routerLink]="['/movies', featuredMovie.id]" class="mt-4 bg-yellow-500 text-black px-6 py-3 rounded-lg font-bold hover:bg-yellow-600">
          ▶ Ver Detalles
        </a>
      </div>

      <!-- Botón anterior -->
      <button (click)="prevMovie()" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-gray-900 bg-opacity-50 text-white p-2 rounded-full">
        ❮
      </button>

      <!-- Botón siguiente -->
      <button (click)="nextMovie()" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-gray-900 bg-opacity-50 text-white p-2 rounded-full">
        ❯
      </button>
    </div>
  </section>

  <!-- Sección de Próximamente -->
  <section class="max-w-6xl mx-auto mt-8">
    <h2 class="text-2xl font-bold mb-4 text-yellow-400">Próximamente</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let movie of upcomingMovies" class="flex items-center bg-gray-800 rounded-lg overflow-hidden">
        <a [routerLink]="['/movies', movie.id]">
          <img [src]="movie.mainImage" alt="{{ movie.title }}" class="w-24 h-24 object-cover">
        </a>
        <div class="p-4">
          <h3 class="text-white font-semibold">{{ movie.title }}</h3>
          <p class="text-gray-400 text-sm">{{ movie.duration }}</p>
        </div>
      </div>
    </div>
    <a href="#" class="text-yellow-400 hover:underline mt-4 inline-block">Explorar tráileres ›</a>
  </section>

  <!-- Sección de Destacado Hoy -->
  <section class="max-w-6xl mx-auto mt-8">
    <h2 class="text-2xl font-bold mb-4 text-yellow-400">Destacado hoy</h2>
    <div class="flex overflow-x-auto space-x-4">
      <div *ngFor="let movie of featuredMovies" class="flex-shrink-0 w-36">
        <a [routerLink]="['/movies', movie.id]">
          <img [src]="movie.mainImage" alt="{{ movie.title }}" class="w-full h-48 object-cover rounded-lg">
        </a>
      </div>
    </div>
  </section>

</div>
