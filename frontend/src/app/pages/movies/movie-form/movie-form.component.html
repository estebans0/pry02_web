<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">{{isEditing ? 'Editar' : 'Agregar'}} Película</h2>
  <form (ngSubmit)="onSubmit()" #movieForm="ngForm" class="max-w-lg">
    <div class="mb-4">
      <label for="title" class="block mb-2">Título:</label>
      <input type="text" id="title" name="title" [(ngModel)]="movie.title" required class="w-full p-2 border rounded">
    </div>
    <div class="mb-4">
      <label for="description" class="block mb-2">Descripción:</label>
      <textarea id="description" name="description" [(ngModel)]="movie.description" required class="w-full p-2 border rounded"></textarea>
    </div>
    <div class="mb-4">
      <label for="genre" class="block mb-2">Género:</label>
      <input type="text" id="genre" name="genre" [(ngModel)]="movie.genre" required class="w-full p-2 border rounded">
    </div>
    <div class="mb-4">
      <label for="director" class="block mb-2">Director:</label>
      <input type="text" id="director" name="director" [(ngModel)]="movie.director" required class="w-full p-2 border rounded">
    </div>
    <div class="mb-4">
      <label for="releaseYear" class="block mb-2">Año de lanzamiento:</label>
      <input type="number" id="releaseYear" name="releaseYear" [(ngModel)]="movie.releaseYear" required class="w-full p-2 border rounded">
    </div>
    <div class="mb-4">
      <label for="rating" class="block mb-2">Calificación:</label>
      <input type="number" id="rating" name="rating" [(ngModel)]="movie.rating" required min="0" max="10" step="0.1" class="w-full p-2 border rounded">
    </div>
    <div class="mb-4">
      <label for="mainImage" class="block mb-2">Imagen principal:</label>
      <input type="file" id="mainImage" (change)="onFileSelected($event)" accept="image/*" class="w-full p-2 border rounded">
    </div>
    <div class="mb-4">
      <label for="cast" class="block mb-2">Reparto:</label>
      <select multiple id="cast" name="cast" [(ngModel)]="selectedActors" class="w-full p-2 border rounded">
        <option *ngFor="let actor of actors" [value]="actor.id">{{actor.name}}</option>
      </select>
    </div>
    <button type="submit" [disabled]="!movieForm.form.valid" class="bg-blue-500 text-white p-2 rounded">
      {{isEditing ? 'Actualizar' : 'Agregar'}} Película
    </button>
  </form>
</div>
