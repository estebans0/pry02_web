<div class="container mx-auto py-6">
  <h2 class="text-4xl font-bold mb-6 text-[var(--accent)]">Películas</h2>

  <!-- Barra de búsqueda, filtros y ordenamiento -->
  <div class="flex flex-col md:flex-row md:space-x-4 mb-6">
    <input
      type="text"
      placeholder="Buscar películas..."
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      class="w-full p-3 border rounded bg-[var(--bg-secondary)] text-[var(--text-primary)] placeholder-[var(--text-secondary)] border-[var(--border-color)] mb-2 md:mb-0"
    >
    <select [(ngModel)]="selectedGenre" (change)="onSearch()" class="p-3 border rounded bg-[var(--bg-secondary)] text-[var(--text-primary)] border-[var(--border-color)]">
      <option value="">Todos los géneros</option>
      <option value="Acción">Acción</option>
      <option value="Drama">Drama</option>
      <option value="Comedia">Comedia</option>
    </select>
    <input
      type="number"
      placeholder="Año de lanzamiento"
      [(ngModel)]="selectedYear"
      (input)="onSearch()"
      class="p-3 border rounded bg-[var(--bg-secondary)] text-[var(--text-primary)] border-[var(--border-color)]"
    >
    <input
      type="number"
      placeholder="Calificación mínima"
      min="0"
      max="10"
      step="0.1"
      [(ngModel)]="selectedRating"
      (input)="onSearch()"
      class="p-3 border rounded bg-[var(--bg-secondary)] text-[var(--text-primary)] border-[var(--border-color)]"
    >
    <select [(ngModel)]="sortBy" (change)="onSearch()" class="p-3 border rounded bg-[var(--bg-secondary)] text-[var(--text-primary)] border-[var(--border-color)]">
      <option value="">Ordenar por...</option>
      <option value="title">Título (A-Z)</option>
      <option value="releaseYear">Más recientes</option>
      <option value="rating">Más populares</option>
    </select>
  </div>

  <!-- Listado de películas -->
  <div *ngFor="let movie of movies" class="card border-[var(--border-color)] bg-[var(--bg-secondary)] text-[var(--text-primary)] p-3 mb-2 rounded">
    <h3 class="text-xl font-bold">{{ movie.title }}</h3>
    <p class="text-[var(--text-secondary)]">{{ movie.description }}</p>
    <p class="text-sm text-[var(--text-secondary)]">Año: {{ movie.releaseYear }} · Calificación: {{ movie.rating }}/10</p>
    <a [routerLink]="['/movies', movie.id]" class="text-[var(--accent)] hover:underline">Ver detalles</a>
  </div>

  <!-- Controles de paginación -->
  <div class="flex items-center space-x-4 mt-4 text-[var(--text-primary)]">
    <button (click)="prevPage()" [disabled]="currentPage === 1" class="px-4 py-2 rounded border border-[var(--border-color)]">Anterior</button>
    <span>Página {{currentPage}} de {{totalPages}}</span>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="px-4 py-2 rounded border border-[var(--border-color)]">Siguiente</button>
  </div>

  <!-- Botón para agregar nueva película (solo para Admin) -->
  <div *ngIf="isAdmin" class="mt-4">
    <a routerLink="/movies/new" class="bg-[var(--accent)] text-[var(--bg-primary)] px-4 py-2 rounded hover:opacity-80">Agregar Nueva Película</a>
  </div>
</div>
