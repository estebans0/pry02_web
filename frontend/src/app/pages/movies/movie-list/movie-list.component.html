<div class="container mx-auto py-6">
  <h2 class="text-4xl font-bold mb-6 text-yellow-400">Películas</h2>

  <!-- Barra de búsqueda y filtros -->
  <div class="flex space-x-4 mb-6">
    <input type="text" placeholder="Buscar películas..."
      class="w-full p-3 border rounded bg-gray-800 text-white placeholder-gray-400">
    <select class="p-3 border rounded bg-gray-800 text-white">
      <option>Todos los géneros</option>
      <option>Acción</option>
      <option>Drama</option>
      <option>Comedia</option>
    </select>
    <select class="p-3 border rounded bg-gray-800 text-white">
      <option>Ordenar por título</option>
      <option>Más recientes</option>
      <option>Más populares</option>
    </select>
  </div>

  <!-- Lista de películas -->
  <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div *ngFor="let movie of movies" class="bg-gray-800 p-4 rounded shadow-lg hover:scale-105 transition">
      <img [src]="movie.mainImage || 'https://via.placeholder.com/300x450'" alt="Movie Poster"
        class="w-full h-64 object-cover rounded">
      <h3 class="text-xl font-bold mt-4">{{ movie.title }}</h3>
      <p class="text-gray-400 text-sm">{{ movie.genre }} - {{ movie.releaseYear }}</p>
      <a [routerLink]="['/movies', movie.id]"
        class="mt-3 inline-block bg-yellow-400 text-black px-4 py-2 rounded hover:bg-yellow-500">
        Ver Detalles
      </a>
    </div>
  </div>
</div>
