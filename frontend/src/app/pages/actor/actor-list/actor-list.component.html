<div class="container mx-auto p-4">
  <h2 class="text-4xl font-bold mb-6 text-yellow-400">Actores</h2>

  <div class="mb-4">
    <input 
      [(ngModel)]="searchTerm" 
      (input)="onSearch()"
      placeholder="Buscar actores" 
      class="p-2 border rounded w-full text-black"
    >
  </div>
  <!-- (rest of the code remains the same) -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let actor of actors" class="border rounded p-4">
      <img [src]="actor.mainImage" alt="{{actor.name}}" class="w-full h-48 object-cover mb-2">
      <h3 class="text-xl font-semibold">{{actor.name}}</h3>
      <p>Fecha de nacimiento: {{actor.birthDate | date}}</p>
      <a [routerLink]="['/actors', actor.id]" class="text-blue-500 hover:underline">Ver detalles</a>
    </div>
  </div>

  <div class="flex items-center space-x-4 mt-4">
    <button (click)="prevPage()" [disabled]="currentPage === 1" style="cursor: pointer;">Anterior</button>
    <span>Página {{currentPage}} de {{totalPages}}</span>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages" style="cursor: pointer;">Siguiente</button>
  </div>

  <button *ngIf="isAdmin" routerLink="/actors/new" class="mt-4 bg-blue-500 text-white p-2 rounded">
    Agregar Actor
  </button>
</div>
