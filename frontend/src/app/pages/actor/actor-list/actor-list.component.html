<div class="container mx-auto p-4">
  <h2 class="text-4xl font-bold mb-6 text-[var(--accent)]">Actores</h2>

  <div class="mb-4">
    <input 
      [(ngModel)]="searchTerm" 
      (input)="onSearch()"
      placeholder="Buscar actores" 
      class="p-2 border rounded w-full bg-[var(--bg-secondary)] text-[var(--text-primary)] border-[var(--border-color)] placeholder-[var(--text-secondary)]"
    >
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let actor of actors" class="card border-[var(--border-color)] bg-[var(--bg-secondary)] text-[var(--text-primary)] p-4 rounded">
      <img [src]="actor.mainImage" alt="{{actor.name}}" class="w-full h-48 object-cover mb-2 rounded">
      <h3 class="text-xl font-semibold">{{actor.name}}</h3>
      <p class="text-[var(--text-secondary)]">Fecha de nacimiento: {{actor.birthDate | date}}</p>
      <a [routerLink]="['/actors', actor.id]" class="text-[var(--accent)] hover:underline">Ver detalles</a>
    </div>
  </div>

  <div class="flex items-center space-x-4 mt-4 text-[var(--text-primary)]">
    <button (click)="prevPage()" [disabled]="currentPage === 1" class="px-4 py-2 border rounded border-[var(--border-color)]">Anterior</button>
    <span>Página {{currentPage}} de {{totalPages}}</span>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="px-4 py-2 border rounded border-[var(--border-color)]">Siguiente</button>
  </div>

  <button *ngIf="isAdmin" routerLink="/actors/new" class="mt-4 bg-[var(--accent)] text-[var(--bg-primary)] p-2 rounded hover:opacity-80">
    Agregar Actor
  </button>
</div>
