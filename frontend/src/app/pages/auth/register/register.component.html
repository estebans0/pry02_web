<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">Registrarse</h2>
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="max-w-lg">
    
    <div class="mb-4">
      <label for="username" class="block mb-2">Nombre de Usuario:</label>
      <input style="color: black;"
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
        required
        class="w-full p-2 border rounded"
      />
    </div>

    <div class="mb-4">
      <label for="email" class="block mb-2">Email:</label>
      <input style="color: black;"
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
        class="w-full p-2 border rounded"
      />
    </div>

    <div class="mb-4">
      <label for="password" class="block mb-2">Contraseña:</label>
      <input style="color: black;"
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
        class="w-full p-2 border rounded"
      />
    </div>

    <button
      type="submit"
      [disabled]="!registerForm.form.valid"
      class="bg-yellow-400 text-black p-2 rounded"
    >
      Registrarse
    </button>
  </form>
</div>
